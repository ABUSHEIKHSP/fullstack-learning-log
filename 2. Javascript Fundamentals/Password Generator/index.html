<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Password Generator</title>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>

        <div id="container">

            <h1 id="heading-line1" class="heading-line">Generate a</h1>
            <h1 id="heading-line2" class="heading-line">random password</h1>

            <button onclick="generatePasswords()">Generate passwords</button>

            </div>

        </div>

        <script src="index.js"></script>
    </body>
